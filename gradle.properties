# Project-wide Gradle settings (aligned with Conductino-Android / Wayer)

org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# AndroidX migration path (modules still on Support Library will need Jetifier)
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# App version — bump these for releases
# ---------------------------------------------------------------------------
app.versionCode=45
app.versionName=1.4.5

# SDK levels (root build.gradle and modules can read these)
compileSdkVersion=36
targetSdkVersion=34
minSdkVersion=26
ndkVersion=29.0.14206865

# Optional ABI filter for local/debug builds (comma-separated)
# aurora.abiFilters=arm64-v8a
