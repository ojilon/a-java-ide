// ─────────────────────────────────────────────────────────────
// :app — Java N-IDE (phone-first, AndroidX, no Fabric/Firebase/IAB)
// ─────────────────────────────────────────────────────────────
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.duy.compiler.javanide'
    compileSdk 36

    defaultConfig {
        applicationId 'com.duy.compiler.javanide'
        minSdk 26
        targetSdk 34

        versionCode project.property('app.versionCode').toInteger()
        versionName project.property('app.versionName')

        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // Stub premium keys (IAB removed)
        buildConfigField 'String', 'BASE64_KEY', '""'
        buildConfigField 'String', 'SKU_PREMIUM', '""'
    }

    sourceSets {
        main {
            res.srcDirs += 'src/main/res-color-picker'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        // dataBinding kept off until layouts are audited; prefer viewBinding later
        viewBinding true
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
                'META-INF/INDEX.LIST',
                'META-INF/plexus/components.xml',
            ]
        }
    }

    lint {
        disable 'MissingTranslation'
    }
}

configurations.configureEach {
    exclude group: 'commons-logging', module: 'commons-logging'
}

dependencies {
    // Local modules
    implementation project(':treeview')
    implementation project(':lib-android-compiler')
    implementation project(':lib-google-java-format')
    implementation project(':androidlogcat')
    implementation project(':common')
    implementation project(':lib-n-ide-release-10')

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // AndroidX (same family as Conductino / Wayer)
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Small utilities still used by editor / project code
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.google.guava:guava:33.2.1-android'
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'commons-io:commons-io:2.15.1'

    // Optional UI helpers (keep only if layouts still reference them)
    implementation 'com.amulyakhare:com.amulyakhare.textdrawable:1.0.1'
    implementation 'com.makeramen:roundedimageview:2.3.0'
    implementation 'com.simplecityapps:recyclerview-fastscroll:2.0.1'
    implementation 'com.sothree.slidinguppanel:library:3.4.0'
    implementation 'com.ogaclejapan.smarttablayout:library:2.0.0@aar'
    implementation 'com.yqritc:recyclerview-flexibledivider:1.4.0'
    implementation 'org.apmem.tools:layouts:1.10@aar'
    implementation 'com.miguelcatalan:materialsearchview:1.4.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
