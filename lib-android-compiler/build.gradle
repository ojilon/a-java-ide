// Compiler path for Java-on-device.
// :aosp:builder removed — that was the on-device APK builder stack.
plugins {
    id 'com.android.library'
}

android {
    namespace 'com.duy.android.compiler'
    compileSdk 36

    defaultConfig {
        minSdk 26
        targetSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/ASL2.0',
                'META-INF/INDEX.LIST',
            ]
        }
    }
}

dependencies {
    api fileTree(dir: 'libs', include: ['*.jar'])

    api project(':bouncycastle')
    api project(':dx')
    api project(':jdk-1_7')
    api project(':common')

    api 'org.eclipse.jdt.core.compiler:ecj:4.6.1'
    api 'net.sf.kxml:kxml2:2.3.0'
    api 'com.google.guava:guava:33.2.1-android'
    api 'commons-io:commons-io:2.15.1'
    api 'commons-codec:commons-codec:1.16.1'
    api 'com.google.code.gson:gson:2.11.0'

    implementation 'androidx.annotation:annotation:1.8.0'
}
