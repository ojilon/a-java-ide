plugins {
    id 'com.android.library'
}

android {
    namespace 'com.google.googlejavaformat'
    compileSdk 36

    defaultConfig {
        minSdk 26
        targetSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    api project(':jdk-1_7')
    api 'com.google.guava:guava:33.2.1-android'
}
