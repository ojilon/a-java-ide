// ─────────────────────────────────────────────────────────────
// a-java-ide — phone-first modules only (Conductino / Wayer style)
// ─────────────────────────────────────────────────────────────
// Dropped: entire :aosp:* tree (on-device APK builder tooling).
// Restore later only if you need build-Android-APK-on-phone again.

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "a-java-ide"

// App + UI helpers
include ':app'
include ':common'
include ':treeview'
include ':androidlogcat'

// Compile / run Java on device
include ':jdk-1_7'
include ':dx'
include ':lib-android-compiler'
include ':lib-google-java-format'
include ':lib-decompiler'

// Crypto (jar signing path) + prebuilt IDE core AAR
include ':bouncycastle'
include ':lib-n-ide-release-10'
