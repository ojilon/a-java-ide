// Root build file — plugin versions only (Conductino / Wayer style).
// Full AGP 8.x + AndroidX migration of all modules is still required;
// this file only aligns the root configuration with modern Gradle.
plugins {
    id 'com.android.application' version '8.13.2' apply false
    id 'com.android.library' version '8.13.2' apply false
    // Google Services / Crashlytics will be re-introduced after AndroidX migration
    // id 'com.google.gms.google-services' version '4.4.2' apply false
}

// Shared SDK levels (modules can still override; prefer reading from gradle.properties)
ext {
    compileSdkVersion = Integer.parseInt(findProperty('compileSdkVersion') ?: '36')
    targetSdkVersion = Integer.parseInt(findProperty('targetSdkVersion') ?: '34')
    minSdkVersion = Integer.parseInt(findProperty('minSdkVersion') ?: '26')
}
